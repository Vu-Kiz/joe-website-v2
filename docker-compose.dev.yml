services:
  db:
    image: mariadb:11.4
    container_name: joe_db_v2_dev          # 👈 v2 name
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Passw0rd1
      MYSQL_DATABASE: joe_v2_dev           # 👈 separate DB name
      MYSQL_USER: Psycho
      MYSQL_PASSWORD: Aislynn1
    volumes:
      - ./db/data:/var/lib/mysql
    ports:
      - "9012:3306"                        # change if 9012 already in use

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: joe_backend_v2_dev     # 👈 v2 name
    restart: unless-stopped
    depends_on:
      - db
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://66.23.202.2:9011

      DB_CONNECTION: mysql
      DB_HOST: db                          # 👈 service name, *not* container_name
      DB_PORT: 3306
      DB_DATABASE: joe_v2_dev
      DB_USERNAME: Psycho
      DB_PASSWORD: Aislynn1
    volumes:
      - ./backend:/var/www/html
    ports:
      - "9011:80"

  composer:
    image: composer:2
    container_name: joe_composer_v2_dev    # 👈 v2 name
    working_dir: /app
    volumes:
      - ./backend:/app
    command: ["composer", "install", "--no-interaction"]

  frontend:
    image: node:22
    container_name: joe_frontend_v2_dev    # 👈 v2 name
    working_dir: /app
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    ports:
      - "9010:5173"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: joe_phpmyadmin_v2_dev
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db               # <— service name for MariaDB
    ports:
      - "9013:80"                # http://66.23.202.2:9013
