name: joe-website-v2-dev

services:
  db:
    image: mariadb:11.4
    container_name: joe_db_v2_dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./db/data:/var/lib/mysql
    ports:
      - "9012:3306"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: joe_backend_v2_dev
    restart: unless-stopped
    depends_on:
      - db
      - meilisearch
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: ${APP_URL}
      BACKEND_STORAGE_URL: ${BACKEND_STORAGE_URL}

      DB_CONNECTION: mysql
      DB_HOST: db              # service name
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: database

      SCOUT_DRIVER: meilisearch
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: ${MEILISEARCH_KEY}
    volumes:
      - ./backend:/var/www/html
    ports:
      - "9011:80"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: joe_worker_v2_dev
    restart: unless-stopped
    depends_on:
      - db
      - backend
      - meilisearch
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: ${APP_URL}
      BACKEND_STORAGE_URL: ${BACKEND_STORAGE_URL}

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: database

      SCOUT_DRIVER: meilisearch
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: ${MEILISEARCH_KEY}
    volumes:
      - ./backend:/var/www/html
    command: >
      sh -c "chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache
      && su -s /bin/sh www-data -c 'php artisan queue:work database
      --queue=swc-sync,default
      --sleep=3
      --tries=1
      --timeout=3600
      --max-time=3600'"

  composer:
    image: composer:2
    container_name: joe_composer_v2_dev
    working_dir: /app
    volumes:
      - ./backend:/app
    command: ["composer", "install", "--no-interaction"]

  frontend:
    image: node:22
    container_name: joe_frontend_v2_dev
    working_dir: /app
    depends_on:
      - backend
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "9010:5173"

  discord-bot:
    image: node:22
    container_name: joe_discord_bot_v2_dev
    working_dir: /app
    depends_on:
      - backend
    env_file:
      - ./discord-bot/.env
    environment:
      DISCORD_BOT_BACKEND_URL: http://backend/api
    volumes:
      - ./discord-bot:/app
    command: >
      sh -c "npm install && npm start"

  meilisearch:
    image: getmeili/meilisearch:v1.8
    container_name: joe_meilisearch_v2_dev
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY}
      MEILI_ENV: development
    volumes:
      - meilisearch_data:/meili_data
    ports:
      - "7700:7700"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: joe_phpmyadmin_v2_dev
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
    ports:
      - "9013:80"

volumes:
  meilisearch_data:
