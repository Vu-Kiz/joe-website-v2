name: joe-website-v2-prod

services:
  db:
    image: mariadb:11.4
    container_name: joe_db_v2_prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: joe_v2_prod
      MYSQL_USER: joe
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - joe_prod_net

  meilisearch:
    image: getmeili/meilisearch:v1.8
    container_name: joe_meilisearch_v2_prod
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    networks:
      - joe_prod_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: joe-backend-v2:prod
    container_name: joe_backend_v2_prod
    restart: unless-stopped
    depends_on:
      - db
      - meilisearch
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: joe_v2_prod
      DB_USERNAME: joe
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: database
      SCOUT_DRIVER: meilisearch
      SCOUT_QUEUE: "false"
      SCOUT_PREFIX: ${SCOUT_PREFIX}
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: ${MEILISEARCH_KEY}
    volumes:
      - backend_public_uploads:/var/www/html/storage/app/public
    networks:
      - joe_prod_net
      - nginx_proxy

  worker-xml:
    image: joe-backend-v2:prod
    container_name: joe_worker_xml_v2_prod
    restart: unless-stopped
    depends_on:
      - db
      - backend
      - meilisearch
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: joe_v2_prod
      DB_USERNAME: joe
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: database
      SCOUT_DRIVER: meilisearch
      SCOUT_QUEUE: "false"
      SCOUT_PREFIX: ${SCOUT_PREFIX}
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: ${MEILISEARCH_KEY}
    command: >
      php artisan queue:work database
      --queue=xml-imports
      --sleep=3
      --timeout=3600
      --max-time=3600
    networks:
      - joe_prod_net

  worker-swc:
    image: joe-backend-v2:prod
    container_name: joe_worker_swc_v2_prod
    restart: unless-stopped
    depends_on:
      - db
      - backend
      - meilisearch
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: joe_v2_prod
      DB_USERNAME: joe
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: database
      SCOUT_DRIVER: meilisearch
      SCOUT_QUEUE: "false"
      SCOUT_PREFIX: ${SCOUT_PREFIX}
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: ${MEILISEARCH_KEY}
    command: >
      php artisan queue:work database
      --queue=swc-sync
      --sleep=3
      --timeout=3600
      --max-time=3600
    networks:
      - joe_prod_net

  worker-search:
    image: joe-backend-v2:prod
    container_name: joe_worker_search_v2_prod
    restart: unless-stopped
    depends_on:
      - db
      - backend
      - meilisearch
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: joe_v2_prod
      DB_USERNAME: joe
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: database
      SCOUT_DRIVER: meilisearch
      SCOUT_QUEUE: "false"
      SCOUT_PREFIX: ${SCOUT_PREFIX}
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: ${MEILISEARCH_KEY}
    command: >
      php artisan queue:work database
      --queue=search-index
      --sleep=3
      --timeout=3600
      --max-time=3600
    networks:
      - joe_prod_net

  worker-payment:
    image: joe-backend-v2:prod
    container_name: joe_worker_payment_v2_prod
    restart: unless-stopped
    depends_on:
      - db
      - backend
      - meilisearch
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: joe_v2_prod
      DB_USERNAME: joe
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: database
      SCOUT_DRIVER: meilisearch
      SCOUT_QUEUE: "false"
      SCOUT_PREFIX: ${SCOUT_PREFIX}
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: ${MEILISEARCH_KEY}
    command: >
      php artisan queue:work database
      --queue=payment-reconcile
      --sleep=10
      --timeout=120
      --max-time=3600
    networks:
      - joe_prod_net

  worker-default:
    image: joe-backend-v2:prod
    container_name: joe_worker_default_v2_prod
    restart: unless-stopped
    depends_on:
      - db
      - backend
      - meilisearch
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: joe_v2_prod
      DB_USERNAME: joe
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: database
      SCOUT_DRIVER: meilisearch
      SCOUT_QUEUE: "false"
      SCOUT_PREFIX: ${SCOUT_PREFIX}
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: ${MEILISEARCH_KEY}
    command: >
      php artisan queue:work database
      --queue=default
      --sleep=3
      --timeout=300
      --max-time=3600
    networks:
      - joe_prod_net

  scheduler:
    image: joe-backend-v2:prod
    container_name: joe_scheduler_v2_prod
    restart: unless-stopped
    depends_on:
      - db
      - backend
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: joe_v2_prod
      DB_USERNAME: joe
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: database
      SCOUT_DRIVER: meilisearch
      SCOUT_QUEUE: "false"
      SCOUT_PREFIX: ${SCOUT_PREFIX}
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: ${MEILISEARCH_KEY}
    command: >
      sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    networks:
      - joe_prod_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        BACKEND_ORIGIN: http://backend
    image: joe-frontend-v2:prod
    container_name: joe_frontend_v2_prod
    restart: unless-stopped
    networks:
      - joe_prod_net
      - nginx_proxy

  discord-bot:
    build:
      context: ./discord-bot
      dockerfile: Dockerfile
    image: joe-discord-bot-v2:prod
    container_name: joe_discord_bot_v2_prod
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - ./discord-bot/.env
    environment:
      DISCORD_BOT_BACKEND_URL: http://backend/api
    networks:
      - joe_prod_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: joe_phpmyadmin_v2_prod
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
    networks:
      - joe_prod_net
      - nginx_proxy

volumes:
  db_data:
  backend_public_uploads:
  meili_data:

networks:
  joe_prod_net:
    driver: bridge

  nginx_proxy:
    external: true
    name: nginxproxymanager_default
