services:
  db:
    image: mariadb:11.4
    container_name: joe_db_v2_prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: joe_v2_prod
      MYSQL_USER: joe
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - joe_prod_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev   # 👈 use the same file you fixed in dev
    image: joe-backend-v2:prod     # tag for the built image
    container_name: joe_backend_v2_prod
    restart: unless-stopped
    depends_on:
      - db
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://api.v2.swc-joe.com

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: joe_v2_prod
      DB_USERNAME: joe
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - joe_prod_net
      - nginx_proxy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev   # or whatever you’ve called the frontend Dockerfile
    image: joe-frontend-v2:prod
    container_name: joe_frontend_v2_prod
    restart: unless-stopped
    networks:
      - joe_prod_net
      - nginx_proxy

volumes:
  db_data:

networks:
  joe_prod_net:
    driver: bridge

  nginx_proxy:
    external: true
    name: nginxproxymanager_default
