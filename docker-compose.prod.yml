name: joe-website-v2-prod

services:
  db:
    image: mariadb:11.4
    container_name: joe_db_v2_prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: joe_v2_prod
      MYSQL_USER: joe
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - joe_prod_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: joe-backend-v2:prod
    container_name: joe_backend_v2_prod
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: joe_v2_prod
      DB_USERNAME: joe
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: database
    volumes:
      - backend_public_uploads:/var/www/html/storage/app/public
    networks:
      - joe_prod_net
      - nginx_proxy

  worker:
    image: joe-backend-v2:prod
    container_name: joe_worker_v2_prod
    restart: unless-stopped
    depends_on:
      - db
      - backend
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: joe_v2_prod
      DB_USERNAME: joe
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: database
    command: >
      php artisan queue:work database
      --queue=swc-sync,default
      --sleep=3
      --tries=1
      --timeout=3600
      --max-time=3600
    networks:
      - joe_prod_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    image: joe-frontend-v2:prod
    container_name: joe_frontend_v2_prod
    restart: unless-stopped
    networks:
      - joe_prod_net
      - nginx_proxy

  discord-bot:
    build:
      context: ./discord-bot
      dockerfile: Dockerfile
    image: joe-discord-bot-v2:prod
    container_name: joe_discord_bot_v2_prod
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - ./discord-bot/.env
    environment:
      DISCORD_BOT_BACKEND_URL: http://backend/api
    networks:
      - joe_prod_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: joe_phpmyadmin_v2_prod
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
    networks:
      - joe_prod_net
      - nginx_proxy

volumes:
  db_data:
  backend_public_uploads:

networks:
  joe_prod_net:
    driver: bridge

  nginx_proxy:
    external: true
    name: nginxproxymanager_default
